<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="robots" content="noindex" />
<title>Pedir instalación | Corvo</title>
<meta name="description" content="Pide la instalación asistida de Corvo y paga por QR." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="pedidos.css" />
</head>
<body class="pg">
<header class="pg-top"><div class="wrap"><a class="brand" href="index.html" aria-label="Corvo, inicio"><span>Corvo</span></a><a class="btn btn-sm btn-ghost" href="index.html">Volver al sitio</a></div></header>
<main class="pg-main" id="app">
<h1>Pide tu instalación</h1>
<p class="lead">Elige qué necesitas, déjanos tus datos y te mostramos el valor exacto y cómo pagar por QR. El instalador se habilita cuando confirmemos tu pago.</p>
<p id="estado" class="aviso" role="status">Cargando precios…</p>
<form id="f" hidden novalidate>
  <fieldset class="opciones" id="items" style="border:0;padding:0;margin:20px 0 0"><legend class="sr">Qué necesitas</legend></fieldset>
  <label class="campo">Nombre<input type="text" name="nombre" autocomplete="name" required maxlength="80" /></label>
  <label class="campo">Correo<input type="email" name="correo" autocomplete="email" required inputmode="email" /></label>
  <label class="campo">WhatsApp<input type="tel" name="whatsapp" autocomplete="tel-national" required inputmode="tel" placeholder="3001234567" /></label>
  <label class="chk"><input type="checkbox" name="terminos" required /><span>He leído y acepto las <a href="condiciones.html" target="_blank" rel="noopener">condiciones del servicio de instalación</a>.</span></label>
  <p id="error" class="aviso err" role="alert" hidden></p>
  <button class="btn" id="enviar" type="submit">Crear mi pedido</button>
</form>
</main>
<script src="pedidos.js"></script>
<script>
(async () => {
  const f = document.getElementById('f'), est = document.getElementById('estado'), items = document.getElementById('items'), err = document.getElementById('error'), btn = document.getElementById('enviar')
  let cat
  try { cat = await api('/v1/pedidos/catalogo') } catch { est.textContent = 'No pudimos cargar los precios ahora. Inténtalo en unos minutos o escríbenos por WhatsApp.'; est.classList.add('err'); return }
  const disp = cat.items.filter((it) => it.disponible !== false)
  if (cat.disponible === false || !disp.length) { est.textContent = 'Próximamente. Todavía no estamos recibiendo pedidos de instalación; escríbenos por WhatsApp y te avisamos.'; return }
  est.textContent = cat.vigente === 'lanzamiento' ? 'Precios de lanzamiento hasta el ' + fechaLarga(cat.lanzamiento_hasta + 'T12:00:00') + '. El plan incluye ' + cat.pcs_incluidas + ' PCs.' : 'El plan incluye ' + cat.pcs_incluidas + ' PCs.'
  disp.forEach((it, i) => {
    const r = el('input', { type: 'radio', name: 'tipo', value: it.tipo, checked: i === 0 })
    items.append(el('label', { className: 'opcion' }, el('span', {}, r, ' ', it.nombre), el('span', { className: 'pr' }, cop(it.precio))))
  })
  f.hidden = false
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.hidden = true
    const d = new FormData(f)
    btn.disabled = true; btn.textContent = 'Creando…'
    try {
      const r = await api('/v1/pedidos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: d.get('tipo'), nombre: d.get('nombre'), correo: d.get('correo'), whatsapp: d.get('whatsapp'), acepta_terminos: d.get('terminos') === 'on' }) })
      location.href = 'pedido.html#t=' + encodeURIComponent(r.token)
    } catch (x) {
      if (x.status === 409 && x.codigo === 'no_disponible') { f.hidden = true; est.textContent = 'Próximamente. Todavía no estamos recibiendo pedidos de instalación; escríbenos por WhatsApp y te avisamos.'; return }
      const m = { tipo: 'Elige qué necesitas.', nombre: 'Escribe tu nombre.', correo: 'Revisa tu correo.', whatsapp: 'Escribe un WhatsApp colombiano de 10 dígitos que empiece por 3.', terminos: 'Debes aceptar las condiciones.', demasiados_pedidos: 'Hiciste varios pedidos seguidos. Intenta más tarde o escríbenos por WhatsApp.' }
      err.textContent = m[x.codigo] || 'No pudimos crear el pedido. Inténtalo de nuevo.'; err.hidden = false
      btn.disabled = false; btn.textContent = 'Crear mi pedido'
    }
  })
})()
</script>
</body>
</html>
