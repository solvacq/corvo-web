<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex" />
<title>Comprar | Corvo</title>
<meta name="description" content="Compra Corvo con un solo pago y paga por QR." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="pedidos.css" />
</head>
<body class="pg">
<header class="pg-top"><div class="wrap"><span class="brand"><span>Corvo</span></span></div></header>
<main class="pg-main" id="app">
<ol class="tiempos" aria-label="Cómo funciona"><li class="on">Pagas</li><li>Verificamos</li><li>Te llega el enlace</li></ol>
<h1>Compra Corvo</h1>
<p class="lead">Pago único, todo incluido. Déjanos tus datos y en el siguiente paso te mostramos el QR para pagar.</p>
<p id="estado" class="aviso" role="status">Cargando el precio…</p>
<form id="f" hidden novalidate>
  <div class="ops" id="items" style="margin:20px 0 0"></div>
  <label class="campo">Nombre<input type="text" name="nombre" autocomplete="name" required maxlength="80" /></label>
  <label class="campo">Correo<input type="email" name="correo" autocomplete="email" required inputmode="email" /></label>
  <label class="campo">WhatsApp<input type="tel" name="whatsapp" autocomplete="tel-national" required inputmode="tel" placeholder="3001234567" /></label>
  <label class="chk"><input type="checkbox" name="terminos" required /><span>He leído y acepto las <a href="condiciones.html" target="_blank" rel="noopener">condiciones del servicio</a>.</span></label>
  <p id="error" class="aviso err" role="alert" hidden></p>
  <button class="btn" id="enviar" type="submit">Continuar al pago</button>
  <p class="small" data-reembolso style="margin-top:10px;text-align:center">Reembolso dentro de los 7 días siguientes al pago. <a href="https://wa.me/573126465778" target="_blank" rel="noopener">¿Dudas? WhatsApp</a></p>
</form>
</main>
<script src="pedidos.js"></script>
<script>
(async () => {
  const f = document.getElementById('f'), est = document.getElementById('estado'), items = document.getElementById('items'), err = document.getElementById('error'), btn = document.getElementById('enviar')
  let cat
  try { cat = await api('/v1/pedidos/catalogo', { cache: 'no-store' }) } catch { est.textContent = 'No pudimos cargar el precio ahora. Inténtalo en unos minutos o escríbenos por WhatsApp.'; est.classList.add('err'); return }
  const disp = cat.items.filter((it) => it.disponible !== false)
  if (cat.disponible === false || !disp.length) { est.textContent = 'Próximamente. Todavía no estamos recibiendo pedidos; escríbenos por WhatsApp y te avisamos.'; return }
  est.hidden = true
  // Un solo pedido y un solo pago: el servidor entrega un único producto (nombre y precio); la página no calcula ni muestra otro valor.
  const it = disp.find((x) => x.tipo === 'corvo') || disp[0]
  items.append(el('label', { className: 'op' }, el('input', { type: 'hidden', name: 'tipo', value: it.tipo }), el('span', { className: 'op-t' }, 'Corvo'), el('span', { className: 'op-d' }, 'Pago único. Incluye instalación, migración y PCs adicionales.'), el('span', { className: 'op-p' }, cop(it.precio) + ' COP')))
  f.hidden = false
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.hidden = true
    const d = new FormData(f)
    btn.disabled = true; btn.textContent = 'Un momento…'
    try {
      const r = await api('/v1/pedidos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: d.get('tipo'), nombre: d.get('nombre'), correo: d.get('correo'), whatsapp: d.get('whatsapp'), acepta_terminos: d.get('terminos') === 'on' }) })
      location.href = 'pedido.html#t=' + encodeURIComponent(r.token)
    } catch (x) {
      if (x.status === 409 && x.codigo === 'no_disponible') { f.hidden = true; est.textContent = 'Próximamente. Todavía no estamos recibiendo pedidos; escríbenos por WhatsApp y te avisamos.'; return }
      const m = { tipo: 'Elige qué necesitas.', nombre: 'Escribe tu nombre.', correo: 'Revisa tu correo.', whatsapp: 'Escribe un WhatsApp colombiano de 10 dígitos que empiece por 3.', terminos: 'Debes aceptar las condiciones.', demasiados_pedidos: 'Hiciste varios pedidos seguidos. Intenta más tarde o escríbenos por WhatsApp.' }
      err.textContent = m[x.codigo] || 'No pudimos crear el pedido. Inténtalo de nuevo.'; err.hidden = false
      btn.disabled = false; btn.textContent = 'Continuar al pago'
    }
  })
})()
</script>
</body>
</html>
